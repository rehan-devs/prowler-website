<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#070707"/>
    </linearGradient>

    <!-- Indigo Accent Glow -->
    <radialGradient id="accentGlow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>

    <!-- Letter Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EDEDED"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base with Border -->
  <rect x="4" y="4" width="120" height="120" rx="32" fill="url(#bgGrad)" stroke="#262626" stroke-width="4"/>

  <!-- Top-Right Accent Light -->
  <rect x="4" y="4" width="120" height="120" rx="32" fill="url(#accentGlow)"/>

  <!-- Stylized Geometric "R" -->
  <path d="M42 34 H72 C85.25 34 94 42 94 53 C94 62.5 87.5 69.5 77.5 71.5 L95 94 H78 L63 73 H56 V94 H42 V34 Z M56 46 V61 H71 C77.5 61 81 58 81 53.5 C81 49 77.5 46 71 46 H56 Z" fill="url(#textGrad)"/>

  <!-- Glowing Accent Indicator Dot -->
  <circle cx="98" cy="98" r="7" fill="#6366F1"/>
  <circle cx="98" cy="98" r="11" fill="#6366F1" opacity="0.3"/>
</svg>